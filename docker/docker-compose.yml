name: socialhub

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ../backend
    image: socialhub-backend
    restart: unless-stopped
    env_file:
      - ../.env  # DATABASE_URL points at the external Postgres (10.0.0.15)
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_started
    command: >
      sh -c "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ../backend
    image: socialhub-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
    command: celery -A app.workers.celery_app worker --loglevel=info

  scheduler:
    build:
      context: ../backend
    image: socialhub-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - backend
    command: celery -A app.workers.celery_app beat --loglevel=info

  frontend:
    build:
      context: ../frontend
    image: socialhub-frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    ports:
      - "8014:80"

volumes:
  uploads_data:
